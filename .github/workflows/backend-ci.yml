name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Access policy tests
        run: npm test

      - name: Production environment validation tests
        run: node test/env.test.js

      - name: Payment webhook signature tests
        run: node test/paymentWebhook.test.js

      - name: Request context tests
        run: node test/requestContext.test.js

      - name: Request logger tests
        run: node test/requestLogger.test.js

      - name: Health check tests
        run: node test/healthCheck.test.js

      - name: Shutdown lifecycle tests
        run: node test/shutdown.test.js

      - name: Dockerfile tests
        run: node test/dockerfile.test.js

      - name: Payment creation rate-limit tests
        run: node test/paymentCreateRateLimit.test.js

      - name: Payment amount validation tests
        run: node test/paymentAmountValidation.test.js

      - name: Payment status transition tests
        run: node test/paymentStatusTransitions.test.js

      - name: Migration validation tests
        run: node test/migrationValidation.test.js
